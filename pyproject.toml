[project]
name = "skillctl"
version = "0.1.0"
description = "Small Git skill manager with persistent frontmatter overrides"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.13",
    "ruamel.yaml>=0.18",
    "rich>=15.0.0",
]

[project.scripts]
skillctl = "skillctl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
